name: Build & Release APK

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Stale Run Guard (Anti-Desync) ---
      # Membandingkan SHA commit yang sedang di-build dengan tip 'main' saat ini di remote.
      # Jika berbeda (mis. re-run job lama setelah ada push baru), abort agar tidak
      # mempublikasikan APK usang sebagai Release terbaru.
      - name: Stale run guard
        run: |
          REMOTE_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          echo "GITHUB_SHA (build ini) : $GITHUB_SHA"
          echo "REMOTE_SHA (tip main)  : $REMOTE_SHA"
          if [ "$GITHUB_SHA" != "$REMOTE_SHA" ]; then
            echo "::error::Stale re-run terdeteksi. GITHUB_SHA tidak cocok dengan tip main. Abort."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Decode release keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore/release.keystore

        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: keystore/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          VERSION_NAME=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Clean up keystore
        if: always()
        run: rm -f keystore/release.keystore

      # --- GitHub Release Rule ---
      # Publikasikan sebagai GitHub Release (bukan hanya Actions artifact) agar file .apk
      # muncul langsung di sidebar beranda repository.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}-${{ github.run_number }}
          name: PowerVault Health Pro v${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
