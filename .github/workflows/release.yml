name: Build & Release APK

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Stale Run Guard (Anti-Desync) ---
      # Membandingkan SHA commit yang sedang di-build dengan tip 'main' saat ini di remote.
      # Jika berbeda (mis. re-run job lama setelah ada push baru), abort agar tidak
      # mempublikasikan APK usang sebagai Release terbaru.
      - name: Stale run guard
        run: |
          REMOTE_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          echo "GITHUB_SHA (build ini) : $GITHUB_SHA"
          echo "REMOTE_SHA (tip main)  : $REMOTE_SHA"
          if [ "$GITHUB_SHA" != "$REMOTE_SHA" ]; then
            echo "::error::Stale re-run terdeteksi. GITHUB_SHA tidak cocok dengan tip main. Abort."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      # Diekstrak lebih awal (sebelum build) agar tetap tersedia untuk penamaan
      # artifact log_fail_<version>_<run-number> walau compile gagal di step berikutnya.
      - name: Extract version name
        id: version
        run: |
          VERSION_NAME=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore/release.keystore

        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      # continue-on-error + log direkam ke file (bukan cuma stdout job) supaya step
      # berikutnya bisa cek status build sekaligus upload log lengkapnya sbg artifact
      # sebelum job diberhentikan (Pending Queue #9, diminta user di Batch 15).
      - name: Build signed release APK
        id: build
        continue-on-error: true
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/keystore/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon 2>&1 | tee gradle-build.log

      # --- Compile Failure Log Capture (Pending Queue #9) ---
      # Upload sbg GitHub Actions artifact (BUKAN Release, sesuai permintaan user)
      # supaya debug hotfix berikutnya tidak perlu user download log manual dari UI Actions.
      - name: Upload failure log artifact
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: log_fail_${{ steps.version.outputs.version }}_${{ github.run_number }}
          path: gradle-build.log
          retention-days: 14

      - name: Abort on build failure
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::Build gagal. Log lengkap diunggah sbg Actions artifact log_fail_${{ steps.version.outputs.version }}_${{ github.run_number }}. Abort sebelum tahap Release."
          exit 1

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*unsigned*" | head -1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      # --- Signed-APK Guard (Release Blocking Rule) ---
      # Jangan pernah publish APK unsigned sebagai GitHub Release. Jika tidak ada APK
      # signed yang ditemukan, abort di sini alih-alih mempublikasikan APK yang tidak
      # bisa diinstal user (Android menolak APK unsigned dari luar ADB).
      - name: Verify APK is signed
        run: |
          if [ -z "${{ steps.apk.outputs.path }}" ]; then
            echo "::error::Tidak ditemukan APK signed di app/build/outputs/apk/release. Cek secrets ANDROID_KEYSTORE_BASE64/PASSWORD/ALIAS dan resolusi path keystore. Abort."
            exit 1
          fi
          echo "Signed APK ditemukan: ${{ steps.apk.outputs.path }}"

      # --- Smart Naming (konsisten dgn konvensi ZIP: <NamaApp>_v<Versi>_<Batch>) ---
      # Rename asset dari nama generik "app-release.apk" jadi self-descriptive supaya
      # user tidak salah pilih/tertukar antar build saat lihat di sidebar Release.
      - name: Rename APK asset
        id: rename
        run: |
          APP_NAME=$(grep -m1 'rootProject.name' settings.gradle.kts | sed -E 's/.*"(.*)".*/\1/' | tr ' ' '_')
          SRC="${{ steps.apk.outputs.path }}"
          DIR=$(dirname "$SRC")
          NEW_NAME="${APP_NAME}_v${{ steps.version.outputs.version }}_${{ github.run_number }}.apk"
          mv "$SRC" "$DIR/$NEW_NAME"
          echo "path=$DIR/$NEW_NAME" >> "$GITHUB_OUTPUT"
          echo "Asset di-rename jadi: $NEW_NAME"

      - name: Clean up keystore
        if: always()
        run: rm -f keystore/release.keystore

      # --- GitHub Release Rule ---
      # Publikasikan sebagai GitHub Release (bukan hanya Actions artifact) agar file .apk
      # muncul langsung di sidebar beranda repository.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: VoltCare v${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          files: ${{ steps.rename.outputs.path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
